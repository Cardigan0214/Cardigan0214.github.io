<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实分析课程主页</title>
  <meta name="Title" content="实分析课程主页">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef8f1;
      --surface: #ffffff;
      --surface-soft: #f6fbf7;
      --ink: #20352a;
      --muted: #60756a;
      --line: #cfe1d5;
      --accent: #157347;
      --accent-dark: #0f5a37;
      --accent-soft: #dff2e7;
      --shadow: 0 16px 40px rgba(34, 75, 49, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(21, 115, 71, 0.12), transparent 30rem),
        linear-gradient(180deg, #f8fcf9 0%, var(--bg) 100%);
      font-family: Georgia, "Times New Roman", "Noto Serif CJK SC", "Songti SC", SimSun, serif;
      line-height: 1.72;
    }

    a {
      color: var(--accent-dark);
      text-decoration: none;
      border-bottom: 1px solid rgba(21, 115, 71, 0.28);
    }

    a:hover {
      color: var(--accent);
      border-bottom-color: currentColor;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 36px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-dark);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      display: inline-grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
    }

    .language-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
    }

    .language-switch button {
      min-width: 54px;
      border: 0;
      border-radius: 999px;
      padding: 7px 12px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    .language-switch button.is-active {
      color: #fff;
      background: var(--accent);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(260px, 0.8fr);
      gap: 28px;
      align-items: end;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-family: "Noto Serif CJK SC", "Songti SC", SimSun, Georgia, serif;
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 1.12rem;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .quick-links a,
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--accent-dark);
      font-weight: 600;
    }

    .hero-panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .hero-panel dl {
      display: grid;
      gap: 12px;
      margin: 0;
    }

    .hero-panel div {
      display: grid;
      gap: 2px;
    }

    .hero-panel dt {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .hero-panel dd {
      margin: 0;
      font-weight: 700;
    }

    main {
      display: grid;
      gap: 24px;
      margin-top: 24px;
    }

    section {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 24px rgba(34, 75, 49, 0.08);
      scroll-margin-top: 20px;
    }

    section h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 1.45rem;
      font-family: "Noto Serif CJK SC", "Songti SC", SimSun, Georgia, serif;
    }

    section h2::before {
      content: "";
      width: 6px;
      height: 24px;
      border-radius: 6px;
      background: var(--accent);
    }

    .notice-list,
    .plain-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .notice-list li,
    .plain-list li {
      position: relative;
      padding-left: 20px;
    }

    .notice-list li::before,
    .plain-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.78em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .info-item {
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .info-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .info-value {
      font-weight: 700;
    }

    .section-intro {
       width: 100%;
    max-width: none;
      color: var(--muted);
    }

    .table-shell {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
      font-size: 0.96rem;
      line-height: 1.55;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: #fff;
      background: var(--accent);
      font-weight: 700;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) {
      background: #f7fbf8;
    }

    tbody tr:hover {
      background: var(--accent-soft);
    }

    td:first-child,
    td:nth-child(2),
    td:nth-child(3) {
      white-space: nowrap;
    }

    .foot {
      margin-top: 24px;
      text-align: right;
    }

    .back-top {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding-top: 12px;
      }

      .hero,
      section {
        padding: 22px;
      }

      .topbar,
      .hero-grid {
        align-items: stretch;
      }

      .topbar,
      .hero-grid,
      .info-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
      }

      .language-switch {
        align-self: flex-start;
      }

      table {
        min-width: 760px;
      }
    }
  </style>
</head>

        <aside class="hero-panel" aria-label="Course snapshot">
          <dl id="heroFacts"></dl>

      </div>
    </header>

    <main>

      </section>

      <section id="notes">

        <div class="section-intro" id="scheduleIntro"></div>
        <div class="table-shell">
          <table>
            <thead>
              <tr id="scheduleHead"></tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
      </section>

      <section id="ex">
        <h2 data-i18n="recitationTitle">习题课</h2>
        <div class="section-intro" id="recitationIntro"></div>
        <div class="table-shell">
          <table>
            <thead>
              <tr id="recitationHead"></tr>
            </thead>
            <tbody id="recitationBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div class="foot">
      <a class="back-top" href="#top" data-i18n="backTop">回到顶部</a>
    </div>
  </div>

      { no: "3", time: ["4月11日（张源意）", "Apr. 11, by Yuanyi Zhang"], location: ["五教 5104", "Teaching Building 5, Room 5104"], notes: link("pdf/RA第三次习题课.pdf", "第三次习题课") },

      { no: "5", time: ["5月11日（涂嘉乐）", "May 11, by Jiale Tu"], location: ["五教 5201", "Teaching Building 5, Room 5201"], notes: link("pdf/RA第五次习题课.pdf", "第五次习题课") },
      { no: "6", time: ["5月30日（张汇泽）", "May 30, by Huize Zhang"], location: ["", ""], notes: link("pdf/RA第六次习题课.pdf", "第六次习题课") },
      { no: "7", time: ["6月6日（涂嘉乐）", "Jun. 6, by Jiale Tu"], location: ["五教 5104", "Teaching Building 5, Room 5104"], notes: link("pdf/RA第七次习题课.pdf", "第七次习题课") },
    ];

    const pick = (value, lang) => Array.isArray(value) ? value[lang === "zh" ? 0 : 1] : value;
    const dash = (value) => value && String(value).trim() ? value : "—";
    const getSavedLang = () => {
      try {
        return localStorage.getItem("ra-course-lang");
      } catch (error) {
        return null;
      }
    };
    const saveLang = (lang) => {
      try {
        localStorage.setItem("ra-course-lang", lang);
      } catch (error) {
        /* Language switching still works if storage is unavailable. */
      }
    };

    function setText(selector, value) {
      document.querySelectorAll(selector).forEach((el) => {
        el.textContent = value;
      });
    }

    function renderList(id, items) {
      const target = document.getElementById(id);
      const listItems = items.map((item) => `<li>${item}</li>`).join("");
      target.innerHTML = target.tagName === "UL"
        ? listItems
        : `<ul class="plain-list">${listItems}</ul>`;
    }

    function renderInfo(items) {
      document.getElementById("courseInfo").innerHTML = items.map(([label, value]) => `
        <div class="info-item">
          <span class="info-label">${label}</span>
          <span class="info-value">${value}</span>
        </div>
      `).join("");
    }

    function renderTableHead(id, headers) {
      document.getElementById(id).innerHTML = headers.map((header) => `<th>${header}</th>`).join("");
    }

    function renderPage(lang) {
      lang = content[lang] ? lang : "zh";
      const t = content[lang];
      const idx = lang === "zh" ? 0 : 1;

      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = t.pageTitle;
      setText("[data-i18n='brand']", t.brand);
      setText("[data-i18n='title']", t.title);
      setText("[data-i18n='subtitle']", t.subtitle);
      setText("[data-i18n='announcementsTitle']", t.announcementsTitle);
      setText("[data-i18n='infoTitle']", t.infoTitle);
      setText("[data-i18n='scheduleTitle']", t.scheduleTitle);
      setText("[data-i18n='recitationTitle']", t.recitationTitle);
      setText("[data-i18n='backTop']", t.backTop);

      document.getElementById("navLinks").innerHTML = t.nav.map(([href, text]) => `<li><a href="${href}">${text}</a></li>`).join("");
      document.getElementById("heroFacts").innerHTML = t.heroFacts.map(([label, value]) => `
        <div>
          <dt>${label}</dt>
          <dd>${value}</dd>
        </div>
      `).join("");

      renderList("announcements", t.announcements);
      renderInfo(t.info);
      renderList("scheduleIntro", t.scheduleIntro);
      renderList("recitationIntro", t.recitationIntro);
      renderTableHead("scheduleHead", t.scheduleHeaders);
      renderTableHead("recitationHead", t.recitationHeaders);

      document.getElementById("scheduleBody").innerHTML = schedule.map((row) => `
        <tr>
          <td>${pick(row.week, lang)}</td>
          <td>${row.lecture}</td>
          <td>${pick(row.date, lang)}</td>
          <td>${pick(row.topic, lang)}</td>
          <td>${dash(row.notes)}</td>
          <td>${dash(pick(row.homework, lang))}</td>
          <td>${dash(pick(row.solution, lang))}</td>
        </tr>
      `).join("");

      document.getElementById("recitationBody").innerHTML = recitations.map((row) => `
        <tr>
          <td>${row.no}</td>
          <td>${row.time[idx]}</td>
          <td>${row.location[idx]}</td>
          <td>${dash(row.notes)}</td>
        </tr>
      `).join("");

      document.querySelectorAll("[data-lang-button]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.langButton === lang);
      });

      saveLang(lang);
    }

    document.querySelectorAll("[data-lang-button]").forEach((button) => {
      button.addEventListener("click", () => renderPage(button.dataset.langButton));
    });

    renderPage(getSavedLang() || "zh");
  </script>
